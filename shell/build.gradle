plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

group='com.github.MCKRGF'

android {
    namespace 'com.yaobing.framemvpproject.shell'

    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        flavorDimensions "channel"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
        applicationId rootProject.ext.applicationId

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    android.applicationVariants.all { variant ->
        println("variant 的内容" + variant)
        variant.outputs.all {
            def createTime = new Date().format("YYMMdd-HH-mm", TimeZone.getTimeZone("GMT+08:00"))
            outputFileName = "FrameMvpProject-master" + "-${createTime}"+"-" + variant.buildType.name  + "-" + variant.productFlavors[0].name+".apk"
        }
    }

    signingConfigs {
        release  {
            storeFile file('./platform.jks')
            storePassword 'android'
            keyAlias "platform"
            keyPassword 'android'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
        dataBinding true
        viewBinding true
    }

    // 配置不同渠道参数
    productFlavors {
        common {
            //渠道参数
            buildConfigField "String", "token", "\"XXXX\""

            // manifest 读取的参数，在 manifest 里如何使用，见后文
            manifestPlaceholders = [
                    "app_name": "阿阿",
                    "channel":"aaaa"
            ]
        }
        huawei {
            //渠道参数
            buildConfigField "String", "token", "\"XXXX\""

            // manifest 读取的参数，在 manifest 里如何使用，见后文
            manifestPlaceholders = [
                    "app_name": "huawei_app",
                    "channel":"huawei"
            ]
        }
        vivo {
            //渠道参数
            buildConfigField "String", "token", "\"XXXX\""

            // manifest 读取的参数，在 manifest 里如何使用，见后文
            manifestPlaceholders = [
                    "app_name": "vivo_app",
                    "channel": "vivo"
            ]
        }
    }


    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    // 添加以下配置排除重复的 LICENSE.txt 文件
    packagingOptions {
        // 1. 排除 LICENSE 文件
        exclude '/META-INF/androidx/annotation/annotation/LICENSE.txt'

        // 2. 排除引起冲突的 json 文件
        exclude '/META-INF/kotlin-project-structure-metadata.json'
    }
}

configurations.all {
    resolutionStrategy {
        // 强制所有用到 window-core 的地方都统一使用 android 版本，避免 jvm 版本混入
        force 'androidx.window:window-core-android:1.3.0'

        // 或者使用依赖替换，将 jvm 版本直接替换为 android 版本
        dependencySubstitution {
            substitute module('androidx.window:window-core-jvm') using module('androidx.window:window-core-android:1.3.0')
        }
    }
}

dependencies {

    implementation "androidx.appcompat:appcompat:$rootProject.ext.appcompatVersion"
    implementation 'com.google.android.material:material:1.3.0'
    testImplementation 'junit:junit:'
    implementation project(path: ':app')
    implementation project(path: ':module_b')
    println("我要动态依赖了： ")
    String[] folders = ["module_A"]
}
