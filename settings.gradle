pluginManagement {
    repositories {
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/google/' }
        maven { url 'https://developer.huawei.com/repo/'}
        maven { url "https://jitpack.io" }
        mavenLocal()
        maven { url 'https://repo1.maven.org/maven2' }
        google()
        maven { url 'https://maven.aliyun.com/repository/jcenter/' }
        gradlePluginPortal()
    }
    plugins {
        // Android Gradle Plugin
        id 'com.android.application' version '8.7.3'
        id 'com.android.library' version '8.7.3'
        
        // Kotlin
        id 'org.jetbrains.kotlin.android' version '2.0.0'
        id 'org.jetbrains.kotlin.jvm' version '2.0.0'
        id 'org.jetbrains.kotlin.kapt' version '2.0.0'
        id 'org.jetbrains.kotlin.plugin.compose' version '2.0.0'
        
        // Other plugins
        id 'maven-publish'
        id 'java-library'
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/google/' }
        maven { url 'https://developer.huawei.com/repo/'}
        maven { url "https://jitpack.io" }
        mavenLocal()
        maven { url 'https://repo1.maven.org/maven2' }
        google()
        maven { url 'https://maven.aliyun.com/repository/jcenter/' }
        flatDir { dirs "libs" }
    }
}

rootProject.name = "FrameMvpProject"
include ':app'
include ':module_A:mylibrary2'
include ':module_A:mylibrary'
include ':module_b'
include ':module_base:module_apt'
include ':module_base:module_compiler'
include ':module_common_view'
include ':module_middleware'
include ':shell'
